name: Deploy to Microsoft Fabric

on:
  workflow_dispatch:
    inputs:
      capacity_id:
        description: Fabric capacity GUID
        required: true
        type: string
      workspace_name:
        description: New Fabric workspace name (must not already exist)
        required: true
        default: IBM Netezza Fabric Integration Demo
        type: string
      lakehouse_name:
        description: Fabric Lakehouse name
        required: true
        default: NetezzaMigrationLakehouse
        type: string
      loader_notebook_name:
        description: Loader notebook name
        required: true
        default: Load Netezza Synthetic Exports
        type: string
      deploy_table_api:
        description: Deploy and run the PyIceberg Table API demo
        required: true
        default: true
        type: boolean
      warehouse_name:
        description: Existing Fabric Warehouse name used by the Table API demo
        required: true
        default: NetezzaMigrationWarehouse
        type: string

permissions:
  contents: read

concurrency:
  group: fabric-netezza-${{ inputs.workspace_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: fabric
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate Azure credentials secret
        shell: bash
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          if [ -z "$AZURE_CREDENTIALS" ]; then
            echo "::error::The AZURE_CREDENTIALS secret is missing or empty in the 'fabric' environment. Configure it with scripts/set-github-azure-credentials.ps1 (see README.md), then re-run this workflow." >&2
            exit 1
          fi

      - name: Sign in to Azure and Fabric
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Deploy Lakehouse demo
        shell: bash
        run: |
          python deploy_to_fabric.py \
            --capacity-id "${{ inputs.capacity_id }}" \
            --workspace-name "${{ inputs.workspace_name }}" \
            --lakehouse-name "${{ inputs.lakehouse_name }}" \
            --notebook-name "${{ inputs.loader_notebook_name }}"

      - name: Deploy PyIceberg Table API demo
        if: ${{ inputs.deploy_table_api }}
        shell: bash
        run: |
          python deploy_table_api_demo.py \
            --workspace-id "$(python -c 'import json; print(json.load(open("deployment-state.json"))["workspace"]["id"])')" \
            --lakehouse-name "${{ inputs.lakehouse_name }}" \
            --warehouse-name "${{ inputs.warehouse_name }}"

      - name: Upload deployment reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fabric-deployment-reports
          if-no-files-found: ignore
          path: |
            deployment-state.json
            table-api-deployment-state.json
