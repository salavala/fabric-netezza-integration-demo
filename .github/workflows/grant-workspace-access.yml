name: Grant Fabric workspace access

on:
  workflow_dispatch:
    inputs:
      workspace_id:
        description: Existing Fabric workspace GUID
        required: true
        type: string
      principal_id:
        description: Microsoft Entra object ID to grant access
        required: true
        type: string
      principal_type:
        description: Microsoft Entra principal type
        required: true
        default: User
        type: choice
        options:
          - User
          - Group
          - ServicePrincipal
      workspace_role:
        description: Fabric workspace role
        required: true
        default: Admin
        type: choice
        options:
          - Admin
          - Member
          - Contributor
          - Viewer

permissions:
  contents: read

jobs:
  grant:
    runs-on: ubuntu-latest
    environment: fabric
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Sign in to Azure and Fabric
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Grant workspace access
        run: |
          python grant_workspace_access.py \
            --workspace-id "${{ inputs.workspace_id }}" \
            --principal-id "${{ inputs.principal_id }}" \
            --principal-type "${{ inputs.principal_type }}" \
            --role "${{ inputs.workspace_role }}"
